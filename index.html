<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เอกซ์โค้ด ลูอา</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

    <!-- Ace Editor & Lua Mode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/mode-lua.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/theme-twilight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/worker-lua.min.js"></script>

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #111111;
            --editor-bg: #141414;
            --border: #262626;
            --text: #cfcfcf;
            --muted: #6b6b6b;
            --accent: #3b82f6;
            --green: #22c55e;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #383838; }

        .nav-link {
            color: var(--muted);
            font-size: 12.5px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: color 0.15s;
        }
        .nav-link:hover { color: #e5e5e5; }

        .run-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e5e5e5;
            font-size: 12.5px;
            font-weight: 600;
            padding: 7px 16px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .run-btn:hover { background: #202020; border-color: #3d3d3d; }
        .run-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .icon-btn {
            color: #8a8a8a;
            font-size: 11.5px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: color 0.15s;
        }
        .icon-btn:hover { color: #e5e5e5; }

        .log-tab {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            padding-bottom: 8px;
            border-bottom: 2px solid transparent;
            cursor: default;
        }
        .log-tab.active { color: #fff; border-color: var(--accent); }

        .drop-overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: rgba(0,0,0,0.6);
            border: 2px dashed var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .fade-in {
            opacity: 0;
            filter: blur(6px);
            transition: opacity 0.9s cubic-bezier(0.22,1,0.36,1), filter 0.9s cubic-bezier(0.22,1,0.36,1);
        }
        .fade-in.show { opacity: 1; filter: blur(0); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script id="app-source" type="text/plain">
        const { useState, useEffect, useRef } = React;

        ace.config.set('basePath', 'https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/');

        const CodeEditor = ({ value, onChange, readOnly = false }) => {
            const editorRef = useRef(null);
            const aceInstance = useRef(null);

            useEffect(() => {
                if (editorRef.current && !aceInstance.current) {
                    aceInstance.current = ace.edit(editorRef.current);
                    aceInstance.current.setTheme("ace/theme/twilight");
                    aceInstance.current.session.setMode("ace/mode/lua");
                    aceInstance.current.setOptions({
                        fontSize: "13.5px",
                        fontFamily: "Consolas, 'Courier New', monospace",
                        showPrintMargin: false,
                        readOnly: readOnly,
                        useWorker: false,
                        showGutter: true,
                        highlightActiveLine: !readOnly,
                    });
                    aceInstance.current.container.style.background = "#141414";
                    aceInstance.current.renderer.setPadding(12);

                    aceInstance.current.on("change", () => {
                        onChange(aceInstance.current.getValue());
                    });
                }
            }, []);

            useEffect(() => {
                if (aceInstance.current) {
                    const currentVal = aceInstance.current.getValue();
                    if (currentVal !== value) {
                        aceInstance.current.setValue(value, -1);
                    }
                }
            }, [value]);

            return <div ref={editorRef} className="w-full h-full"></div>;
        };

        const App = () => {
            const [source, setSource] = useState('-- Write or Paste your Lua script here\nprint("Hello, DexCode System!")');
            const [output, setOutput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [isOutputVisible, setIsOutputVisible] = useState(true);
            const [isDragging, setIsDragging] = useState(false);

            const [logs, setLogs] = useState([
                { time: new Date().toLocaleTimeString('th-TH', { hour12: false }), type: 'info', msg: 'ระบบ DexCode พร้อมใช้งานแล้ว' },
                { time: new Date().toLocaleTimeString('th-TH', { hour12: false }), type: 'info', msg: 'เกี่ยวกับ Obfuscation...' },
            ]);

            const logRef = useRef(null);

            useEffect(() => {
                if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
            }, [logs]);

            const addLog = (msg, type = 'info') => {
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString('th-TH', { hour12: false }), type, msg }]);
            };

            const handleDragOver = (e) => { e.preventDefault(); e.stopPropagation(); if (!isDragging) setIsDragging(true); };
            const handleDragLeave = (e) => {
                e.preventDefault(); e.stopPropagation();
                if (!e.relatedTarget || !e.currentTarget.contains(e.relatedTarget)) setIsDragging(false);
            };
            const handleDrop = (e) => {
                e.preventDefault(); e.stopPropagation(); setIsDragging(false);
                const file = e.dataTransfer.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => { setSource(ev.target.result); addLog(`โหลดไฟล์แล้ว: ${file.name}`, 'success'); };
                    reader.onerror = () => addLog(`เกิดข้อผิดพลาดขณะอ่านไฟล์: ${file.name}`, 'error');
                    reader.readAsText(file);
                }
            };

            const handleDownload = () => {
                if (!output) return;
                const blob = new Blob([output], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'protected.lua';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
                addLog('ดาวน์โหลดไฟล์ผลลัพธ์แล้ว', 'success');
            };

            const handleCopy = () => {
                if (!output) return;
                navigator.clipboard.writeText(output)
                    .then(() => addLog('คัดลอกผลลัพธ์ไปยังคลิปบอร์ดแล้ว', 'success'))
                    .catch((err) => addLog(`คัดลอกไม่สำเร็จ: ${err.message}`, 'error'));
            };

            const handlePastebin = () => {
                addLog('กำลังอัปโหลดไปยัง Pastebin...', 'info');
            };

            const handleRun = async () => {
                if (isLoading) return;
                setIsLoading(true);
                addLog('เริ่มดำเนินการปกปิดข้อมูลด้วย DexCode...', 'info');
                setIsOutputVisible(true);

                try {
                    const startTime = performance.now();
                    const response = await fetch('/obfuscate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ source })
                    });
                    const data = await response.json().catch(() => null);
                    if (!response.ok) {
                        const errMsg = (data && data.message) ? data.message : `HTTP Error: ${response.status}`;
                        throw new Error(errMsg);
                    }
                    const duration = (performance.now() - startTime).toFixed(2);
                    if (data && data.status === 'success' && data.result) {
                        setIsOutputVisible(false);
                        setTimeout(() => {
                            setOutput(data.result);
                            addLog(`ความพยายามสำเร็จเรียบร้อย! (${duration}ms)`, 'success');
                            setTimeout(() => setIsOutputVisible(true), 50);
                        }, 50);
                    } else {
                        throw new Error((data && data.message) ? data.message : 'ไม่พบผลลัพธ์จากเซิร์ฟเวอร์');
                    }
                } catch (err) {
                    addLog(err.message, 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="flex flex-col h-screen w-screen overflow-hidden">

                    {/* HEADER */}
                    <div className="h-[52px] bg-[var(--panel)] flex items-center justify-between px-5 border-b border-[var(--border)] select-none">
                        <div className="flex items-center gap-2.5">
                            <i className="fas fa-shield-halved text-[17px]" style={{ color: 'var(--accent)' }}></i>
                            <span className="text-[15px] font-semibold text-white">เอกซ์โค้ด ลูอา</span>
                        </div>
                        <div className="flex items-center gap-6">
                            <a href="#" className="nav-link"><i className="fas fa-code"></i> ผู้ปกปิดข้อมูล</a>
                            <a href="https://discord.gg/SnK744ZM9Y" target="_blank" rel="noreferrer" className="nav-link">
                                <i className="fab fa-discord"></i> ฝากสนับสนุน Discord
                            </a>
                        </div>
                    </div>

                    {/* MAIN */}
                    <div className="flex-grow flex flex-col p-4 gap-4 overflow-hidden">
                        <div className="flex-grow flex gap-4 overflow-hidden">

                            {/* SOURCE PANE */}
                            <div className="w-1/2 flex flex-col rounded-lg border border-[var(--border)] overflow-hidden bg-[var(--panel)]">
                                <div className="h-[42px] flex items-center justify-between px-4 border-b border-[var(--border)]">
                                    <div className="flex items-center gap-2 text-[13px] font-medium text-gray-300">
                                        <i className="fas fa-file-code text-blue-400"></i> รหัสต้นฉบับ
                                    </div>
                                    <button onClick={handleRun} disabled={isLoading} className="run-btn">
                                        <i className={`fas ${isLoading ? 'fa-spinner fa-spin' : 'fa-play'}`}></i> ดำเนินการ
                                    </button>
                                </div>
                                <div
                                    className="flex-grow relative"
                                    style={{ background: 'var(--editor-bg)' }}
                                    onDragOver={handleDragOver}
                                    onDragLeave={handleDragLeave}
                                    onDrop={handleDrop}
                                >
                                    {isDragging && (
                                        <div className="drop-overlay">
                                            <div className="bg-[#111] px-6 py-4 rounded-lg shadow-xl border border-blue-500/30 flex flex-col items-center">
                                                <i className="fas fa-file-upload text-blue-500 text-3xl mb-2"></i>
                                                <span className="text-blue-100 font-bold">วางไฟล์ตรงนี้</span>
                                                <span className="text-blue-400/70 text-xs">เพื่อโหลดเนื้อหา</span>
                                            </div>
                                        </div>
                                    )}
                                    <CodeEditor value={source} onChange={setSource} />
                                </div>
                            </div>

                            {/* OUTPUT PANE */}
                            <div className="w-1/2 flex flex-col rounded-lg border border-[var(--border)] overflow-hidden bg-[var(--panel)]">
                                <div className="h-[42px] flex items-center justify-between px-4 border-b border-[var(--border)]">
                                    <div className="flex items-center gap-2 text-[13px] font-medium text-gray-300">
                                        <i className="fas fa-lock text-blue-400"></i> ได้รับการคุ้มครอง
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <button onClick={handleDownload} className="icon-btn"><i className="fas fa-download"></i> ดาวน์โหลด</button>
                                        <button onClick={handlePastebin} className="icon-btn"><i className="fas fa-cloud"></i> พาสตี้</button>
                                        <button onClick={handleCopy} className="icon-btn"><i className="far fa-copy"></i> สำเนา</button>
                                    </div>
                                </div>
                                <div className={`flex-grow relative fade-in ${isOutputVisible ? 'show' : ''}`} style={{ background: 'var(--editor-bg)' }}>
                                    <CodeEditor value={output} onChange={() => {}} readOnly={true} />
                                </div>
                            </div>
                        </div>

                        {/* LOGS */}
                        <div className="h-[190px] rounded-lg border border-[var(--border)] bg-[var(--panel)] flex flex-col overflow-hidden">
                            <div className="px-5 py-2.5 border-b border-[var(--border)]">
                                <span className="log-tab active">บันทึกระบบ</span>
                            </div>
                            <div ref={logRef} className="flex-grow p-3.5 font-mono text-[12px] overflow-y-auto select-text">
                                {logs.map((log, i) => (
                                    <div key={i} className="mb-1.5 flex">
                                        <span className="text-gray-600 w-[80px] shrink-0">[{log.time}]</span>
                                        <span className={`w-[68px] shrink-0 font-bold ${
                                            log.type === 'error' ? 'text-red-500' : log.type === 'success' ? 'text-green-500' : 'text-blue-500'
                                        }`}>
                                            [{log.type === 'error' ? 'ผิดพลาด' : log.type === 'success' ? 'ตกลง' : 'อินเฟฟ'}]
                                        </span>
                                        <span className="text-gray-300 break-all">{log.msg}</span>
                                    </div>
                                ))}
                                {logs.length === 0 && <span className="text-gray-600 italic">ยังไม่มีบันทึก...</span>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        (function bootApp() {
            const missing = [];
            if (!window.React) missing.push('React');
            if (!window.ReactDOM) missing.push('ReactDOM');
            if (!window.Babel) missing.push('Babel');
            if (!window.ace) missing.push('Ace Editor');

            if (missing.length > 0) {
                document.getElementById('root').innerHTML =
                    '<pre style="padding:16px;color:#ff6b6b;background:#141414;height:100vh;margin:0;white-space:pre-wrap;">Missing dependency: ' + missing.join(', ') + '</pre>';
                return;
            }

            const source = document.getElementById('app-source').textContent;
            try {
                const compiled = Babel.transform(source, {
                    sourceType: 'script',
                    presets: [['env', { modules: false }], ['react', { runtime: 'classic' }]]
                }).code;
                new Function(compiled)();
            } catch (err) {
                console.error(err);
                document.getElementById('root').innerHTML =
                    '<pre style="padding:16px;color:#ff6b6b;background:#141414;height:100vh;margin:0;white-space:pre-wrap;">Frontend compile error:\n' + String(err && err.stack ? err.stack : err) + '</pre>';
            }
        })();
    </script>
</body>
</html>
